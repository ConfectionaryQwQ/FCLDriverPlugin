name: Android CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Install Android SDK packages
        shell: bash
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl --fail --location --retry 3 \
            'https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip' \
            --output "$RUNNER_TEMP/android-cli.zip"
          echo "e025545c62a8e64c7559119566a569fb1dec5f60  $RUNNER_TEMP/android-cli.zip" | sha1sum --check
          unzip -q "$RUNNER_TEMP/android-cli.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          "$ANDROID_HOME/cmdline-tools/latest/bin/android" "--sdk=$ANDROID_HOME" sdk install 'platforms/android-37.0'
          "$ANDROID_HOME/cmdline-tools/latest/bin/android" "--sdk=$ANDROID_HOME" sdk install 'build-tools/36.0.0'
      - name: Build and lint test APK
        run: ./gradlew :app:assembleDebug :app:lintDebug --no-daemon --console=plain
      - name: Upload test APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Turnip-26.3.0_MrPurple-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
